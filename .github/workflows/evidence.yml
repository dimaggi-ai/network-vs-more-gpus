name: Evidence provenance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/validate_evidence.py evidence.json
      - run: python -m unittest discover -s tools -p test_evidence_validation.py
