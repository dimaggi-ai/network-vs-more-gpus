name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Test suite (invariants, closed forms, cross-fidelity)
        run: PYTHONPATH=src python -m pytest tests/ -q
      - name: External validation against published measurements
        run: python validation/validate_llama3.py
      - name: Span-tier validation registry, and what it declines
        run: python validation/validate_span.py
      - name: Span experiments and figures reproduce
        run: |
          python experiments/run_span_experiments.py
          python figures/palette_check.py
          python figures/make_span_figures.py
